<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const a = prompt("Enter a:");
        const b = prompt("Enter b:");
        const c = prompt("Enter c:");
        const s = (a + b + c)/2;
        alert(`Area is : ${Math.sqrt(s(s-a)*(s-b)*(s-c))}`);
    </script>
</body>
